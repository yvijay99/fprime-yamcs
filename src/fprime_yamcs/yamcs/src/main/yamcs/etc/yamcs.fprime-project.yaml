services:
  - class: org.yamcs.archive.XtceTmRecorder
  - class: org.yamcs.archive.ParameterRecorder
  - class: org.yamcs.archive.AlarmRecorder
  - class: org.yamcs.archive.EventRecorder
  - class: org.yamcs.archive.ReplayServer
  - class: org.yamcs.parameter.SystemParametersService
    args:
      producers:
        - fs
        - jvm
  - class: org.yamcs.ProcessorCreatorService
    args:
      name: realtime
      type: realtime
  - class: org.yamcs.archive.CommandHistoryRecorder
  - class: org.yamcs.parameterarchive.ParameterArchive
    args:
      realtimeFiller:
        enabled: true
  # Instantiated explicitly to bound its parameter cache; the implicit default
  # caches every processed value without limit and can exhaust the heap.
  # cacheAll false: only parameters actually retrieved get cached, so
  # high-rate realtime-only telemetry just flows through uncached.
  - class: org.yamcs.parameter.ParameterRetrievalService
    args:
      parameterCache:
        cacheAll: false
        maxNumEntries: 32
        duration: 60
  - class: org.yamcs.plists.ParameterListService
  - class: org.yamcs.timeline.TimelineService
  - class: org.yamcs.ProcessRunner
    args:
      command: ["fprime-yamcs-events"]
      restart: "always"
      logLevel: INFO

  # Bridge service: reformats CFDP packets from tm_realtime to cfdp_in
  # This is needed because tm_realtime tuples have a "packet" column but
  # CfdpService expects a "pdu" column
  - class: com.example.myproject.CfdpBridgeService
    args:
      inStream: tm_realtime
      outStream: cfdp_in
      fileApid: 3

  # Uplink bridge: sends CFDP PDUs from cfdp_out to spacecraft via TC link
  - class: com.example.myproject.CfdpUplinkBridge
    args:
      inStream: cfdp_out
      uplinkLink: UDP_TC_OUT.vc1
      fileApid: 3

  # CFDP Service - F Prime CFDP file transfer
  # Entity IDs from lib/fprime/Svc/Ccsds/CfdpManager/Parameters.fppi
  # F´ LocalEid=42, FileInDefaultDestEntityId=100
  # So YAMCS must be entity 100, F´ is entity 42
  # FprimeCfdpService, not stock org.yamcs.cfdp.CfdpService: F´ doesn't support
  # the CFDP Message-To-User TLVs that drive downlink-initiation and directory
  # listing. This subclass sends CfdpManager.SendFile / FileManager.ListDirectory
  # commands instead and collects the resulting F´ events.
  - class: com.example.myproject.FprimeCfdpService
    # Named for what it is. This slot once held
    # com.example.myproject.FprimeFilePacketService (the Fw::FilePacket
    # implementation); YAMCS's File Transfer UI shows the service name, so the
    # old label made CFDP transfers look like FilePacket ones.
    name: CfdpService
    args:
      # REQUIRED: CfdpService compares this against its own runtime class name
      # to decide whether it is its own file-listing service. Left at the
      # default the comparison fails for any subclass and YAMCS instantiates a
      # second, detached CfdpService.
      fileListingServiceClassName: com.example.myproject.FprimeCfdpService

      sendFileCommand: ""      # auto-discovered by suffix when blank
      downlinkChannelId: 0
      downlinkKeep: KEEP
      downlinkPriority: 0

      # "." is the flight software's working directory, where uploads with a
      # relative destination land. "/" browses the whole host filesystem, which
      # on a laptop deployment means macOS root and takes ~1s per entry to list.
      remoteRoot: "."

      inStream: cfdp_in
      outStream: cfdp_out

      # YAMCS entity ID (matches F´'s FileInDefaultDestEntityId)
      localEntities:
        - name: yamcs
          id: 100
          bucket: fprimeFilesIn
      # F´ entity ID (matches F´'s LocalEid)
      remoteEntities:
        - name: fprime
          id: 42

      # EntityId=U32, TransactionSeq=U32, MaxPduSize
      # Frame size is 1024, TC frame overhead ~7 bytes, CCSDS header 6 bytes, ComPacket descriptor 2 bytes
      # Available: 1024 - 7 - 6 - 2 = 1009 bytes
      # Use 992 to match F´'s OutgoingFileChunkSize parameter
      entityIdLength: 4
      sequenceNrLength: 4
      maxPduSize: 992

      # ChannelConfig timing parameters (Parameters.fppi)
      eofAckTimeout: 10000
      eofAckLimit: 10
      finAckTimeout: 10000
      finAckLimit: 10
      nakLimit: 10
      inactivityTimeout: 120000
      immediateNak: true

      # Fault handlers
      #
      # "cancel", not "suspend": a suspended transfer parks in PAUSED and is
      # never evicted from CfdpService's pending map. The duplicate-path check
      # keeps scanning it, and a PAUSED transfer with a null remotePath NPEs
      # that check -- after which every later upload fails with a 500 until
      # YAMCS restarts. "cancel" reaches FAILED and gets evicted.
      senderFaultHandlers:
        AckLimitReached: cancel
        NakLimitReached: cancel
        InactivityDetected: cancel
      receiverFaultHandlers:
        AckLimitReached: cancel
        NakLimitReached: cancel
        InactivityDetected: cancel

dataLinks:
  - name: UDP_TM_IN
    class: org.yamcs.tctm.ccsds.UdpTmFrameLink
    port: 50000
    frameType: "TM"
    spacecraftId: 68
    frameLength: 1024
    errorDetection: CRC16
    virtualChannels:
      - vcId: 1
        ocfPresent: false
        service: "PACKET"
        maxPacketLength: 1024
        packetPreprocessorClassName: com.example.myproject.FprimePacketPreprocessor
        stream: "tm_realtime"

  - name: UDP_TC_OUT
    class: org.yamcs.tctm.ccsds.UdpTcFrameLink
    host: localhost
    port: 50001
    spacecraftId: 68
    maxFrameLength: 1024
    errorDetection: CRC16
    virtualChannels:
      - vcId: 1
        ocfPresent: false
        service: "PACKET"
        priority: 1
        commandPostprocessorClassName: com.example.myproject.FprimeCommandPostprocessor
        stream: "tc_realtime"
        useCop1: false

mdb:
  # Configuration of the active loaders
  # Valid loaders are: sheet, xtce or fully qualified name of the class
  - type: xtce
    args:
      file: mdb/fprime.xtce.xml

# Configuration for streams created at server startup
streamConfig:
  # cfdp_in/cfdp_out are declared in cfdp_streams.sql, not here. Streams listed
  # under tm:/tc: get the standard TM/TC column definition and any custom
  # schema is ignored, which yields a "packet" column instead of the "pdu"
  # column CfdpService requires.
  sqlFile: "etc/cfdp_streams.sql"
  tm:
    - name: "tm_realtime"
      processor: "realtime"
    - name: "tm_dump"
  cmdHist: ["cmdhist_realtime", "cmdhist_dump"]
  event: ["events_realtime", "events_dump"]
  param: ["pp_realtime", "pp_dump", "sys_param", "proc_param"]
  parameterAlarm: ["alarms_realtime"]
  tc:
    - name: "tc_realtime"
      processor: "realtime"
